name: Deploy to Railway
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --service b90ddc04-fba8-4abc-9253-55feb3520ad5
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
