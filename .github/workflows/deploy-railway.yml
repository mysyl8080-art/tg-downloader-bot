name: Deploy to Railway
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --service b90ddc04-fba8-4abc-9253-55feb3520ad5 --detach
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 44e3b0fc-618a-4c2c-a5e0-ca7683029f48
          RAILWAY_ENVIRONMENT_ID: 8407edda-3bec-49bf-b88d-d414d1852bf7
